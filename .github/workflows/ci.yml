# CI gates for every push and pull request. Policy: CONSTITUTION.md Article VIII; runbook: docs/ci-cd.md.
# Three parallel jobs, each under four minutes. All three are required status checks on `main`.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

# A new push to the same branch cancels the run still going for the previous commit, except on
# `main`, where every commit keeps its own verdict (Render deploys a commit only when its run passed).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  checks:
    name: checks (lint, typecheck, test)
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  build:
    name: build (production build, migrations, boot)
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Committed migrations match the schema
        run: |
          pnpm --filter @dealingwith/backend db:generate
          git add --intent-to-add apps/backend/drizzle
          if ! git diff --exit-code --stat -- apps/backend/drizzle; then
            echo "::error::schema.ts changed without a committed migration. Run 'pnpm --filter @dealingwith/backend db:generate' and commit apps/backend/drizzle."
            exit 1
          fi

      - run: pnpm build

      # Render skips the deploy of a commit that touches only buildFilter.ignoredPaths (render.yaml).
      # Prove those paths cannot change production: delete every tracked file they match, rebuild,
      # and require a byte-identical build. The boot check below then runs in the pruned tree, so the
      # built server also starts without them. A pattern with no "/" is also deleted at any depth, in
      # case Render matches it there. The rebuild does not reinstall, so install inputs (the root and
      # app package.json files, pnpm-lock.yaml, pnpm-workspace.yaml, .npmrc) must never be listed.
      - name: Paths the deploy ignores do not change the build
        run: |
          set -o pipefail
          command -v yq > /dev/null || { echo "::error::yq is not installed on this runner."; exit 1; }
          dist_hash() { find apps/*/dist packages/*/dist -type f -print0 | sort -z | xargs -0 sha256sum; }
          dist_hash > "$RUNNER_TEMP/dist-before.txt"
          yq -r '.services[] | select(.name == "dealingwith-agent") | .buildFilter.ignoredPaths[]' render.yaml > "$RUNNER_TEMP/patterns.txt"
          mapfile -t listed < "$RUNNER_TEMP/patterns.txt"
          if [ "${#listed[@]}" -eq 0 ]; then
            echo "::error::render.yaml lists no buildFilter.ignoredPaths for dealingwith-agent."
            exit 1
          fi
          patterns=()
          for p in "${listed[@]}"; do
            if ! git ls-files -- ":(glob)$p" | grep -q .; then
              echo "::error::'$p' in render.yaml buildFilter.ignoredPaths matches no tracked file. Remove it, or fix its quoting."
              exit 1
            fi
            patterns+=("$p")
            [[ "$p" == */* ]] || patterns+=("**/$p")
          done
          git ls-files -z -- "${patterns[@]/#/:(glob)}" > "$RUNNER_TEMP/ignored.bin"
          echo "Deleting $(tr -cd '\0' < "$RUNNER_TEMP/ignored.bin" | wc -c) tracked files matched by ${#listed[@]} patterns, then rebuilding."
          xargs -0 rm -f -- < "$RUNNER_TEMP/ignored.bin"
          rm -rf apps/*/dist packages/*/dist
          pnpm build
          dist_hash > "$RUNNER_TEMP/dist-after.txt"
          if ! diff "$RUNNER_TEMP/dist-before.txt" "$RUNNER_TEMP/dist-after.txt"; then
            echo "::error::A path in render.yaml buildFilter.ignoredPaths changes the build (diff above). Remove it from the list: a commit touching only that path would skip a deploy it needs."
            exit 1
          fi

      - name: Built server boots, answers /healthz and serves the web
        env:
          DATABASE_URL: pglite://memory
          PORT: 3999
        run: |
          node apps/backend/dist/index.js > boot.log 2>&1 &
          server=$!
          reason="the built server did not answer /healthz within 30 seconds"
          for _ in $(seq 1 30); do
            if curl -sf http://localhost:3999/healthz > /dev/null; then
              reason=""
              break
            fi
            sleep 1
          done
          if [ -z "$reason" ] && ! curl -sf http://localhost:3999/login | grep -qi '<!doctype html'; then
            reason="the built server answers /healthz but does not serve the web build at /login"
          fi
          kill "$server" 2>/dev/null || true
          if [ -n "$reason" ]; then
            echo "::error::$reason"
            cat boot.log
            exit 1
          fi

  hygiene:
    name: hygiene (secrets, tracked files)
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the secret scan below walks the whole history

      - name: No private or ignored file is tracked
        run: |
          tracked=$(git ls-files | grep -E '^docs/hackathon/|(^|/)\.env$|(^|/)\.env\.|\.(pem|key|p12|pfx)$' | grep -vE '(^|/)\.env\.example$' || true)
          if [ -n "$tracked" ]; then
            echo "::error::private files are tracked:"
            echo "$tracked"
            exit 1
          fi
          for pattern in 'docs/hackathon/' '.env' '.data/'; do
            if ! grep -qxF "$pattern" .gitignore; then
              echo "::error::.gitignore no longer lists '$pattern'."
              exit 1
            fi
          done

      # The gitleaks CLI, pinned by version and verified against the release checksums, scans every
      # commit of every branch. (gitleaks/gitleaks-action only scans the pushed commits on push events.)
      - name: Secret scan over the whole history
        env:
          GITLEAKS_VERSION: 8.30.1
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/gitleaks"
          cd "$RUNNER_TEMP/gitleaks"
          gh release download "v$GITLEAKS_VERSION" --repo gitleaks/gitleaks \
            --pattern "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            --pattern "gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz$" "gitleaks_${GITLEAKS_VERSION}_checksums.txt" | sha256sum --check --strict
          tar -xzf "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" gitleaks
          cd "$GITHUB_WORKSPACE"
          "$RUNNER_TEMP/gitleaks/gitleaks" git --redact --verbose --no-banner --exit-code 1 .
