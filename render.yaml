# Render Blueprint: one web service (API, MCP, webhooks and the built web in one Node process) and
# one Postgres instance. Field names and plan ids follow Render's Blueprint spec as read on
# 2026-11-08. Operations guide: infra/README.md. Deploy policy: CONSTITUTION.md Article VIII.
services:
  - type: web
    name: dealingwith-agent
    runtime: node
    plan: 0.5c-512mb
    region: oregon
    branch: main
    # A commit on main deploys only after its CI run passes (the three required checks).
    autoDeployTrigger: checksPass
    # ...and only when it touches a path outside this list. Nothing listed here reaches the built app
    # or the running server, and CI proves it on every run: the build job deletes every tracked file
    # these patterns match, rebuilds, requires a byte-identical build and boots it. List only files
    # the build never reads; the agent prompts are Markdown under apps/backend/src/agent, so never
    # add a pattern like **/*.md. Patterns are globs from the repository root.
    # Decision: docs/decisions/2026-11-11-deploys-skip-paths-that-cannot-reach-production.md.
    buildFilter:
      ignoredPaths:
        - "docs/**"
        - "README.md"
        - "AGENTS.md"
        - "CLAUDE.md"
        - "CONSTITUTION.md"
        - "LICENSE"
        - "infra/**"
        - ".github/**"
        - "tests/**"
        - "evals/**"
        - "**/*.test.ts"
        - "**/*.test.tsx"
        - ".editorconfig"
        - ".env.example"
        - ".gitleaks.toml"
        - "biome.json"
        - "vitest.config.ts"
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm build
    startCommand: pnpm --filter @dealingwith/backend start
    healthCheckPath: /healthz
    # Custom domain (infra/README.md, last section). Render adds www. with a redirect to the root.
    domains:
      - dealingwith.si
    envVars:
      - key: NODE_VERSION
        value: "22"
      # corepack must not wait for a confirmation when it downloads the pinned pnpm.
      - key: COREPACK_ENABLE_DOWNLOAD_PROMPT
        value: "0"
      - key: DATABASE_URL
        fromDatabase:
          name: dealingwith-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: PAYPAL_MODE
        value: sandbox
      # Secrets: typed into the Render dashboard, never into this file.
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      # Registered once the service has its URL (infra/README.md, step 3).
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      - key: LLM_PROVIDER
        value: anthropic
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      # Dashboard-owned and empty until the domain is attached: the backend falls back to Render's
      # RENDER_EXTERNAL_URL and refuses a non-https value (infra/README.md). No trailing slash.
      - key: APP_URL
        sync: false
      # Demo logins, demo seed and "Reset demo data" until real authentication ships after the
      # submission (docs/decisions/2026-11-08-hosted-at-dealingwith-si-demo-mode-until-submission.md).
      - key: DEMO_MODE
        value: "true"
      # Read by Vite at build time: the web calls the API on the same origin.
      - key: VITE_API_MODE
        value: http
      # Build-time too. Empty renders the dashboard in trial mode with a watermark.
      - key: VITE_AG_STUDIO_LICENSE
        sync: false

databases:
  - name: dealingwith-db
    plan: 0.1c-256mb
    region: oregon
    postgresMajorVersion: "17"
